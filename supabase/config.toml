project_id = "peohauhwquuvghrpmotf"

[auth]
# Where Supabase sends people when a link has no valid redirect of its own.
# Left at localhost, every password-reset email points at a dev server the
# recipient does not have running.
site_url = "https://angliaeducate.co.uk"
# resetPasswordForEmail passes `${window.location.origin}/reset-password`, but
# Supabase only honours a redirect that matches one of these — anything else
# falls back to site_url without complaining.
additional_redirect_urls = [
  "https://angliaeducate.co.uk/**",
  "http://localhost:8080/**",
]

# Leaked-password protection (HIBP) is a dashboard setting on hosted Supabase:
# Authentication → Sign In / Providers → Password. The CLI has no config table
# for it, and the `[auth.security]` block that used to sit here made every
# `supabase functions deploy` fail with "failed to parse config".

# Called hourly by the purge-deleted-accounts cron with no key (see
# 20260923114330_account_deletions.sql). schedule/undo check the caller's own
# session; purge only acts on rows a tutor already booked and that are due.
[functions.delete-account]
verify_jwt = false
