# The edge functions run on Deno with URL imports, so the app's TypeScript
# setup cannot see them. Until this existed, nothing caught a type error in
# them before a hand deploy. Typecheck, plus the billing tests, which run the
# real functions against in-memory Stripe and Supabase: deploys stay manual.
name: Edge functions

on:
  pull_request:
    paths:
      - "supabase/functions/**"
      - "scripts/test-billing-functions/**"
      - ".github/workflows/edge-functions.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "scripts/test-billing-functions/**"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The functions never see the app's package.json (the edge runtime has
      # none), so npm: specifiers must resolve on their own, not via node_modules.
      - run: deno check supabase/functions/*/index.ts
        env:
          DENO_NO_PACKAGE_JSON: "1"
      # No network and no secrets: the import map swaps the SDKs for mocks.
      - run: >-
          deno run --no-config --cached-only
          --import-map=scripts/test-billing-functions/import_map.json
          --allow-env --allow-read
          scripts/test-billing-functions/one-plan-per-student.ts
        env:
          DENO_NO_PACKAGE_JSON: "1"
